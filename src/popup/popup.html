<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clefkey.</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- Écran connexion (aucune session) -->
    <section id="screen-login" class="screen" hidden>
      <header class="brand">
        <img class="brand-logo" src="../icons/icon-48.png" alt="" width="32" height="32" />
        <div class="brand-text">
          <h1>Clefkey.</h1>
          <p>Entrez votre mot de passe maître.</p>
        </div>
        <div class="brand-actions">
          <button class="icon-btn btn-theme" type="button" title="Mode clair" aria-label="Passer en mode clair">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </div>
      </header>

      <form id="form-login" class="form" autocomplete="on">
        <label class="field">
          <span class="field-label">E-mail</span>
          <span class="field-control">
            <input id="login-email" type="email" name="email" autocomplete="username" placeholder="vous@exemple.org" required />
            <svg class="field-key" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
          </span>
        </label>
        <label class="field">
          <span class="field-label">Mot de passe maître</span>
          <span class="field-control">
            <input id="login-master" type="password" name="master" autocomplete="current-password" placeholder="••••••••••••" required />
            <svg class="field-key" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
          </span>
        </label>
        <button id="btn-login" class="btn btn-primary" type="submit">Déverrouiller</button>
      </form>
      <p class="hint">Pas encore de compte ? <button id="btn-login-vault" class="link" type="button">Créer un compte</button></p>
    </section>

    <!-- Écran verrouillage (session existante) -->
    <section id="screen-unlock" class="screen" hidden>
      <header class="brand">
        <img class="brand-logo" src="../icons/icon-48.png" alt="" width="32" height="32" />
        <div class="brand-text">
          <h1>Clefkey.</h1>
          <p id="unlock-who" class="who">Session verrouillée</p>
        </div>
        <div class="brand-actions">
          <button class="icon-btn btn-theme" type="button" title="Mode clair" aria-label="Passer en mode clair">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </div>
      </header>

      <form id="form-unlock" class="form" autocomplete="on">
        <label class="field">
          <span class="field-label">Mot de passe maître</span>
          <span class="field-control">
            <input id="unlock-master" type="password" name="master" autocomplete="current-password" placeholder="••••••••••••" required />
            <svg class="field-key" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
          </span>
        </label>
        <button id="btn-unlock" class="btn btn-primary" type="submit">Déverrouiller</button>
      </form>
      <div class="row">
        <button id="btn-unlock-logout" class="link link-danger" type="button">Se déconnecter</button>
      </div>
    </section>

    <!-- Écran déverrouillé -->
    <section id="screen-main" class="screen" hidden>
      <header class="brand">
        <img class="brand-logo" src="../icons/icon-48.png" alt="" width="32" height="32" />
        <div class="brand-text">
          <h1>Clefkey.</h1>
          <p id="main-user" class="who"></p>
        </div>
        <div class="brand-actions">
          <button class="icon-btn btn-theme" type="button" title="Mode clair" aria-label="Passer en mode clair">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <button id="btn-lock" class="icon-btn" type="button" title="Verrouiller" aria-label="Verrouiller">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </button>
        </div>
      </header>

      <div class="section-title">
        <span id="main-host" class="host"></span>
        <button id="btn-reload" class="link" type="button">Actualiser</button>
      </div>
      <div id="accounts" class="accounts">
        <div class="placeholder">Chargement…</div>
      </div>

      <div class="actions">
        <button id="btn-generator" class="btn btn-primary" type="button">Générer</button>
        <button id="btn-open-vault" class="vault-link" type="button">clefkey.vercel.app</button>
      </div>
    </section>

    <!-- Écran générateur -->
    <section id="screen-generator" class="screen" hidden>
      <header class="brand">
        <img class="brand-logo" src="../icons/icon-48.png" alt="" width="32" height="32" />
        <div class="brand-text">
          <h1>Générateur</h1>
          <p>Généré sur cet appareil.</p>
        </div>
        <div class="brand-actions">
          <button class="icon-btn btn-theme" type="button" title="Mode clair" aria-label="Passer en mode clair">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <button id="btn-gen-back" class="icon-btn" type="button" title="Retour" aria-label="Retour">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
        </div>
      </header>

      <div class="gen-tabs" role="tablist">
        <button type="button" class="gen-tab is-active" data-gen-mode="password" role="tab" aria-selected="true">Mot de passe</button>
        <button type="button" class="gen-tab" data-gen-mode="passphrase" role="tab" aria-selected="false">Passphrase</button>
      </div>

      <div class="gen-panel" data-gen-panel="password">
        <div class="field">
          <span class="field-label">Longueur</span>
          <div class="gen-row">
            <div class="stepper stepper-split">
              <input id="gen-length" type="number" min="8" max="64" value="20" aria-label="Longueur" />
              <div class="step-stack">
                <button id="gen-length-plus" type="button" class="step-btn" aria-label="Augmenter">+</button>
                <button id="gen-length-minus" type="button" class="step-btn" aria-label="Réduire">−</button>
              </div>
            </div>
            <button id="btn-gen-password" class="icon-btn gen-run" type="button" title="Générer un mot de passe" aria-label="Générer un mot de passe">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
          </div>
        </div>
        <div class="gen-output">
          <input id="gen-password-value" type="text" readonly placeholder="Mot de passe" autocomplete="off" spellcheck="false" />
          <button id="btn-gen-copy" class="icon-btn" type="button" title="Copier" aria-label="Copier" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          </button>
        </div>
        <p id="gen-password-status" class="gen-status" hidden></p>
        <div id="gen-save" class="gen-save" hidden>
          <span class="field-label">Enregistrer pour ce site</span>
          <p id="gen-save-site" class="gen-save-site"></p>
          <input id="gen-save-user" type="text" name="username" autocomplete="username" placeholder="Identifiant" />
          <button id="btn-gen-save" class="btn btn-primary" type="button">Enregistrer</button>
        </div>
      </div>

      <div class="gen-panel" data-gen-panel="passphrase" hidden>
        <div class="field">
          <span class="field-label">Nombre de mots</span>
          <div class="gen-row">
            <div class="stepper stepper-split">
              <input id="gen-pp-count" type="number" min="3" max="10" value="5" aria-label="Nombre de mots" />
              <div class="step-stack">
                <button id="gen-pp-plus" type="button" class="step-btn" aria-label="Augmenter">+</button>
                <button id="gen-pp-minus" type="button" class="step-btn" aria-label="Réduire">−</button>
              </div>
            </div>
            <button id="btn-gen-pp" class="icon-btn gen-run" type="button" title="Générer une passphrase" aria-label="Générer une passphrase">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
          </div>
        </div>
        <div class="gen-output">
          <input id="gen-pp-value" type="text" readonly placeholder="Passphrase" autocomplete="off" spellcheck="false" />
          <button id="btn-pp-copy" class="icon-btn" type="button" title="Copier" aria-label="Copier" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          </button>
        </div>
        <p class="gen-status is-safe">Générée sur cet appareil.</p>
      </div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
